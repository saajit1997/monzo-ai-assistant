[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monzo-ai-assistant"
version = "0.1.0"
description = "Independent portfolio project: an AI knowledge assistant built on Monzo's public website content."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Monzo AI Knowledge Assistant contributors" }]

dependencies = [
    "httpx>=0.27",
    "defusedxml>=0.7",
    "beautifulsoup4>=4.12",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]
